<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather — AgriVision AI</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/weather.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <img src="../assets/images/logo.svg" alt="AgriVision AI" class="nav-logo" />
      <span class="nav-title">AgriVision AI</span>
    </div>
    <ul class="nav-links">
      <li><a href="../index.html" class="nav-link">Dashboard</a></li>
      <li><a href="plant-identifier.html" class="nav-link">Plant ID</a></li>
      <li><a href="disease-detector.html" class="nav-link">Disease</a></li>
      <li><a href="weather.html" class="nav-link active">Weather</a></li>
      <li><a href="ai-advisor.html" class="nav-link">AI Advisor</a></li>
      <li><a href="crop-planner.html" class="nav-link">Crop Planner</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
  </nav>

  <main class="page-main">
    <div class="page-header">
      <h1>⛅ Weather Intelligence</h1>
      <p>Real-time weather and AI-powered farming advice for your location.</p>
    </div>

    <!-- Location search -->
    <div class="weather-search-bar">
      <input type="text" id="cityInput" class="input input-lg" placeholder="Search city… e.g. Mumbai, IN" />
      <button id="searchWeatherBtn" class="btn btn-primary">Search</button>
      <button id="geoWeatherBtn" class="btn btn-secondary" title="Use my location">📍 My Location</button>
    </div>

    <!-- Current weather card -->
    <div id="currentWeatherCard" class="weather-card hidden">
      <div class="weather-card-main">
        <div class="weather-icon-lg" id="weatherIconLg"></div>
        <div class="weather-temp-block">
          <span class="weather-temp" id="weatherTemp"></span>
          <span class="weather-feels" id="weatherFeels"></span>
          <span class="weather-desc" id="weatherDesc"></span>
        </div>
      </div>
      <div class="weather-meta-grid">
        <div class="weather-meta-item">
          <span class="meta-icon">💧</span>
          <span class="meta-label">Humidity</span>
          <span class="meta-value" id="weatherHumidity"></span>
        </div>
        <div class="weather-meta-item">
          <span class="meta-icon">💨</span>
          <span class="meta-label">Wind</span>
          <span class="meta-value" id="weatherWind"></span>
        </div>
        <div class="weather-meta-item">
          <span class="meta-icon">📊</span>
          <span class="meta-label">Pressure</span>
          <span class="meta-value" id="weatherPressure"></span>
        </div>
        <div class="weather-meta-item">
          <span class="meta-icon">👁️</span>
          <span class="meta-label">Visibility</span>
          <span class="meta-value" id="weatherVisibility"></span>
        </div>
      </div>
    </div>

    <!-- Forecast strip -->
    <div id="forecastStrip" class="forecast-strip hidden">
      <h2 class="section-subtitle">5-Day Forecast</h2>
      <div class="forecast-grid" id="forecastGrid"></div>
    </div>

    <!-- AI farming insight -->
    <div id="farmInsightCard" class="farm-insight-card hidden">
      <h2 class="section-subtitle">🤖 AI Farming Insight</h2>
      <div class="form-group insight-crop-row">
        <input type="text" id="insightCrop" class="input" placeholder="Enter crop (optional)…" />
        <button id="getInsightBtn" class="btn btn-accent">Get AI Advice</button>
      </div>
      <div id="insightText" class="insight-text markdown-body"></div>
    </div>
  </main>

  <footer class="footer-simple"><p>&copy; 2025 AgriVision AI</p></footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/weather.js"></script>
</body>
</html>
